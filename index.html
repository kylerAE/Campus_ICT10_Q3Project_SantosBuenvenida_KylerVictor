<!DOCTYPE html>
<html>
<head>
    <title>Intramurals Sign Up</title>
    <style>
        /* ... Your existing styles stay exactly the same ... */
        body {
            margin: 0;
            font-family: Arial;
            background: #fdf6ec;
            text-align: center;
        }

        .navbar {
            padding: 15px;
            text-align: right;
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .navbar a {
            padding: 10px 18px;
            text-decoration: none;
            color: white;
            border-radius: 8px;
            margin-left: 10px;
            background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
            background-size: 300%;
            animation: rainbowMove 4s linear infinite;
        }

        @keyframes rainbowMove {
            0% {background-position: 0%}
            100% {background-position: 300%}
        }

        .card {
            background: white;
            width: 350px;
            margin: 100px auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        h2 {
            background: linear-gradient(90deg, red, orange, yellow, green, blue, violet);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        input {
            width: 90%;
            padding: 10px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            width: 95%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: bold;
            background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
            background-size: 300%;
            animation: rainbowMove 3s linear infinite;
            cursor: pointer;
        }

        /* Added a small style for the message area */
        #msg {
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html">Sign Up</a>
    <a href="teamchecker.html">Team Checker</a>
    <a href="players.html">Players</a>
</div>

<div class="card">
    <h2>Create Account</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    
    <button onclick="handleSignUp()">Sign Up</button>
    
    <p id="msg"></p>
</div>

<script>
function handleSignUp() {
    // 1. Grab the values from the inputs
    let user = document.getElementById("user").value;
    let pass = document.getElementById("pass").value;
    let display = document.getElementById("msg");

    // 2. The Logic: Check if they are empty
    if (user === "" || pass === "") {
        display.style.color = "red";
        display.innerHTML = "Error: Please put your name and password!";
    } else {
        display.style.color = "gray";
        display.innerHTML = "Account created successfully!";
        
        // Optional: Clear the inputs after success
        document.getElementById("user").value = "";
        document.getElementById("pass").value = "";
    }
}
</script>

</body>
</html>
